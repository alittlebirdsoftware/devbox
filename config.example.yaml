# Example config for the agent-task daemon. Copy to config.yaml and edit
# NO real secrets here - token_ref is the LoadCredential secret name only

socket_path: /run/agent-task/agent-task.sock
data_dir: /var/lib/agent-task

limits:
  max_concurrent: 2
  task_timeout: 30m

repos:
  - name: devbox
    owner: iQonAi
    repo: devbox
    default_branch: main
    token_ref: gh-token-devbox
  # A repo whose agent needs a remote MCP server (e.g. Artlist image generation):
  # mcp_servers is written to $HOME/.claude.json in the container; mcp_creds_ref
  # names a LoadCredential secret holding the agent's MCP OAuth store (the
  # mcpOAuth section of a claude .credentials.json). Public egress is already
  # allowed (only RFC1918/CGNAT/link-local are denied), so no network change.
  # - name: branded-cart-hero
  #   owner: alittlebirdsoftware
  #   repo: branded-cart-hero
  #   default_branch: main
  #   token_ref: gh-token-branded-cart-hero
  #   mcp_servers: { artlist: https://mcp.artlist.io/mcp }
  #   mcp_creds_ref: claude-mcp-credentials
  #   env_secrets: { GEMINI_API_KEY: gemini-api-key }   # env var NAME -> LoadCredential secret NAME (value never in config)
  #   model: claude-sonnet-5            # image/orchestration tasks: Sonnet is enough; code repos: claude-opus-5

# Agent base image and the podman command (the cross-user wrapper on the VM).
image: localhost/devbox-agent-base:dev
podman: "sudo -u agentbox /usr/local/sbin/agentbox-podman"

# Per-agent auth policy. token_ref names a LoadCredential secret (never the key).
agents:
  claude:
    auth: subscription
    token_ref: claude-oauth-token
    # model: claude-opus-5             # default for repos that do not pin one; the hardest class may try claude-fable-5-1
  pi:
    auth: api_key # pi has no non-interactive subscription auth; key is ANTHROPIC_API_KEY
    token_ref: anthropic-api-key
